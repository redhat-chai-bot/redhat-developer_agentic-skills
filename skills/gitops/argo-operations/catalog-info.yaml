apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: argo-operations
  namespace: ai5-marketplace
  title: Argo Operations
  description: >
    Set up, deploy, promote, and manage Red Hat OpenShift GitOps resources on live OpenShift
    and Kubernetes clusters. Covers Argo CD installation (OpenShift GitOps operator, Helm,
    Autopilot), Application and ApplicationSet lifecycle, Rollout promotion and rollback,
    and day-2 operations (upgrades, API migration, scaling replica counts). Every write
    operation uses dry-run first and requires explicit user confirmation before applying.
    Use when users want to install Argo CD, create or sync Applications, promote Rollouts,
    or perform operational changes on their OpenShift GitOps setup. Argo Workflows and Argo
    Events are out of scope.
  labels:
    distribution: external
  annotations:
    backstage.io/source-location: >-
      url:https://github.com/redhat-developer/agentic-skills/blob/main/skills/gitops/argo-operations/SKILL.md
  tags:
    - ai-skill
    - gitops
    - argocd
  links:
    - url: https://github.com/redhat-developer/agentic-skills
      title: Source Repository
      icon: github
spec:
  type: skill
  lifecycle: beta
  owner: group:redhat/ai5-marketplace
  disciplines:
    - gitops
  categories:
    - cluster-management
  agents: []
  dependsOn:
    - airesource:ai5-marketplace/openshift-gitops
  dependencyOf: []
